<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a0c" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: #e2ecec;
        font-family: "Segoe UI", Inter, sans-serif;
        -webkit-user-select: none;
      }
      body {
        display: grid;
        place-items: center;
      }
      .shell {
        position: relative;
        display: flex;
        width: calc(100% - 24px);
        height: calc(100% - 24px);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(94, 234, 212, .18);
        border-radius: 26px;
        background:
          radial-gradient(ellipse at 50% 24%, rgba(45, 212, 191, .13), transparent 43%),
          radial-gradient(ellipse at 80% 90%, rgba(59, 130, 246, .10), transparent 42%),
          rgba(7, 10, 12, .97);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .58), inset 0 0 50px rgba(45, 212, 191, .025);
      }
      .shell::before, .shell::after {
        position: absolute;
        content: "";
        pointer-events: none;
      }
      .shell::before {
        inset: 0;
        opacity: .16;
        background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
        background-size: 36px 36px;
        mask-image: linear-gradient(transparent, #000 25%, #000 78%, transparent);
      }
      .shell::after {
        top: 0;
        left: 12%;
        width: 76%;
        height: 1px;
        background: linear-gradient(90deg, transparent, #2dd4bf, transparent);
        box-shadow: 0 0 14px rgba(45, 212, 191, .8);
      }
      .content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: -6px;
      }
      .emblem-wrap {
        position: relative;
        display: grid;
        width: 118px;
        height: 118px;
        margin-bottom: 25px;
        place-items: center;
      }
      .orbit {
        position: absolute;
        inset: 3px;
        border: 1px solid rgba(45, 212, 191, .23);
        border-radius: 50%;
        animation: orbit 14s linear infinite;
      }
      .orbit::before, .orbit::after {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #5eead4;
        box-shadow: 0 0 10px #2dd4bf;
        content: "";
      }
      .orbit::before { top: 15px; left: 14px; }
      .orbit::after { right: 5px; bottom: 34px; width: 3px; height: 3px; }
      .orbit-inner {
        position: absolute;
        inset: 15px;
        border: 1px solid rgba(94, 234, 212, .12);
        border-radius: 50%;
        animation: orbit 20s linear infinite reverse;
      }
      .crest {
        z-index: 1;
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        border: 1px solid rgba(94, 234, 212, .6);
        border-radius: 22px;
        background: linear-gradient(145deg, rgba(45, 212, 191, .19), rgba(7, 10, 12, .9) 68%);
        box-shadow: 0 0 34px rgba(45, 212, 191, .2), inset 0 0 20px rgba(45, 212, 191, .08);
        animation: breathe 3s ease-in-out infinite;
      }
      .crest svg { width: 40px; height: 40px; filter: drop-shadow(0 0 8px rgba(45, 212, 191, .5)); }
      .wordmark {
        margin: 0;
        color: #f3fbfb;
        font-size: 32px;
        font-weight: 750;
        letter-spacing: .22em;
        line-height: 1;
        text-indent: .22em;
      }
      .tagline {
        margin: 12px 0 0;
        color: #88aaa9;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: .28em;
        text-indent: .28em;
        text-transform: uppercase;
      }
      .loading {
        position: absolute;
        right: 42px;
        bottom: 34px;
        left: 42px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .status {
        flex: 1;
        color: #6c8082;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      .dots { display: flex; gap: 5px; }
      .dots i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #2dd4bf;
        opacity: .35;
        animation: dot 1.2s ease-in-out infinite;
      }
      .dots i:nth-child(2) { animation-delay: .16s; }
      .dots i:nth-child(3) { animation-delay: .32s; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes breathe { 50% { transform: translateY(-2px) scale(1.035); } }
      @keyframes dot { 50% { opacity: 1; box-shadow: 0 0 8px rgba(45, 212, 191, .8); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 8s !important; }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-label="Arise is starting">
      <div class="content">
        <div class="emblem-wrap" aria-hidden="true">
          <div class="orbit"></div>
          <div class="orbit-inner"></div>
          <div class="crest">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M9 33.5 23.8 10l5.5 8.7-4.2 6.6 5.3-3.4L39 37H9Z" stroke="#5eead4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M16 37h21M19.2 28.5l4.6-7.2 3.3 5.2" stroke="#d5fffa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9" />
            </svg>
          </div>
        </div>
        <h1 class="wordmark">ARISE</h1>
        <p class="tagline">Evolve &nbsp;·&nbsp; Adapt &nbsp;·&nbsp; Ascend</p>
      </div>
      <div class="loading">
        <span class="status">Preparing your world</span>
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </main>
  </body>
</html>
