<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0d0d0d;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", "Inter", sans-serif;
        -webkit-user-select: none;
      }
      body {
        background:
          radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.18), transparent 45%),
          radial-gradient(circle at 75% 75%, rgba(34, 211, 238, 0.14), transparent 50%),
          #0d0d0d;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .mark {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 55%, #22d3ee 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(139, 92, 246, 0.35), 0 0 70px rgba(34, 211, 238, 0.18);
        animation: pulse 1.8s ease-in-out infinite;
      }
      .mark svg { width: 44px; height: 44px; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      .title {
        font-family: "Rajdhani", "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #ffffff;
      }
      .title span { color: #22d3ee; }
      .bar-track {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #8b5cf6, #22d3ee);
        animation: load 1.1s ease-in-out infinite;
      }
      @keyframes load {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(280%); }
      }
      .status {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 14 L12 7 L20 14" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
          <path d="M4 19 L12 12 L20 19" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="title">SYSTEM<span>.exe</span></div>
      <div class="bar-track"><div class="bar-fill"></div></div>
      <div class="status">Initializing local database&hellip;</div>
    </div>
  </body>
</html>
